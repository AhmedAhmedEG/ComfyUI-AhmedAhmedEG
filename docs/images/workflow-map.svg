<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" role="img" aria-labelledby="title desc"><title id="title">H3 Director workflow: where each job belongs</title><desc id="desc">Model and decoder loaders connect to Master. Media loaders feed Reference Pack. Director Settings supplies the generation canvas and schedule. Master publishes current results to Smart Preview and Project Video export. Optional stages connect as modifiers.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8z" fill="#659580"/></marker><style>text{font-family:system-ui,sans-serif;fill:#243e32}.h{font-size:19px;font-weight:650}.s{font-size:13px;fill:#55715d}.box{fill:#ffffff;stroke:#c4d6c5;stroke-width:1.5}.flow{fill:none;stroke:#659580;stroke-width:2;marker-end:url(#arrow)}</style></defs><rect width="1000" height="500" rx="10" fill="#edf3e8"/><text x="32" y="42" class="h">One owner for each part of the job</text><text x="32" y="66" class="s">A wiring diagram — the following screenshots show the actual ComfyUI controls.</text>
<g><rect class="box" x="32" y="100" width="260" height="85" rx="7"/><text x="50" y="131" class="h">Models, encoder &amp; VAEs</text><text x="50" y="155" class="s">FL2VA + REF2VA · minimax text</text><text x="50" y="174" class="s">Video VAE + audio VAE</text></g>
<g><rect class="box" x="32" y="210" width="260" height="74" rx="7"/><text x="50" y="241" class="h">Director Settings</text><text x="50" y="266" class="s">Output canvas · initial sampling</text></g>
<g><rect class="box" x="32" y="309" width="260" height="93" rx="7"/><text x="50" y="339" class="h">Loader nodes → Ref Pack</text><text x="50" y="364" class="s">Available media · names · trim</text><text x="50" y="386" class="s">Input MP · crop · stream choice</text></g>
<g><rect x="380" y="145" width="260" height="190" rx="8" fill="#193f33"/><text x="402" y="180" style="fill:#f0f5e8;font-size:24px;font-weight:650">Master timeline</text><text x="402" y="212" style="fill:#cadfc9;font-size:14px">Clip type · prompt · assignments</text><text x="402" y="238" style="fill:#cadfc9;font-size:14px">Continuity · local LoRAs</text><text x="402" y="264" style="fill:#cadfc9;font-size:14px">Approval · generation</text><text x="402" y="306" style="fill:#e6d4a3;font-size:13px">One current result per clip</text></g>
<g><rect class="box" x="727" y="145" width="240" height="80" rx="7"/><text x="745" y="177" class="h">Smart Preview</text><text x="745" y="202" class="s">Latest / full · stages · playback</text></g>
<g><rect class="box" x="727" y="255" width="240" height="80" rx="7"/><text x="745" y="287" class="h">Project Video</text><text x="745" y="312" class="s">Export current cached results</text></g>
